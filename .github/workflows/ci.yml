name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests (money engine, database schema, receipt reader)
        run: npm test
      - name: Type-check the edge functions (Deno)
        run: npx -y deno@2 check supabase/functions/scan-receipt/index.ts supabase/functions/place-search/index.ts supabase/functions/fx-rate/index.ts
      - name: Build the website
        run: npm run build:web
        env:
          EXPO_OFFLINE: '1'
