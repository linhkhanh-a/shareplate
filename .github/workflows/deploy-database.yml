name: Deploy database

# Applies new files in supabase/migrations to the live Supabase project
# whenever they land on main. Can also be run by hand from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/deploy-database.yml'
  workflow_dispatch:

concurrency:
  group: deploy-database
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_ID: wplcciadxmfijckjkhjj
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the secrets are set
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Add these GitHub secrets (Settings > Secrets and variables > Actions):$missing"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply new migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy the receipt reader (edge function)
        run: supabase functions deploy scan-receipt --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show which migrations are live
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
